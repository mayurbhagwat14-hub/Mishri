<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EC" />
      <stop offset="50%" stop-color="#FCE7EE" />
      <stop offset="100%" stop-color="#F4D9E5" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="900" fill="url(#bg)" rx="16" />
  
  <!-- Subtle patterned decorative border -->
  <rect x="25" y="25" width="750" height="850" fill="none" stroke="#E8BDC8" stroke-width="2" stroke-dasharray="8 6" rx="12" />
  
  <!-- Delicate corner floral accents -->
  <g fill="#D88FA5" opacity="0.65">
    <!-- Top-left -->
    <circle cx="50" cy="50" r="7" />
    <circle cx="62" cy="45" r="5" />
    <circle cx="45" cy="62" r="5" />
    <circle cx="58" cy="58" r="4" fill="#F4C4CF" />
    
    <!-- Top-right -->
    <circle cx="750" cy="50" r="7" />
    <circle cx="738" cy="45" r="5" />
    <circle cx="755" cy="62" r="5" />
    <circle cx="742" cy="58" r="4" fill="#F4C4CF" />
    
    <!-- Bottom-left -->
    <circle cx="50" cy="850" r="7" />
    <circle cx="62" cy="855" r="5" />
    <circle cx="45" cy="838" r="5" />
    <circle cx="58" cy="842" r="4" fill="#F4C4CF" />
    
    <!-- Bottom-right -->
    <circle cx="750" cy="850" r="7" />
    <circle cx="738" cy="855" r="5" />
    <circle cx="755" cy="838" r="5" />
    <circle cx="742" cy="842" r="4" fill="#F4C4CF" />
  </g>
  
  <!-- Center circle frame with soft glow -->
  <circle cx="400" cy="380" r="190" fill="#FFF8F1" stroke="#F4C4CF" stroke-width="6" filter="url(#softGlow)" />
  <circle cx="400" cy="380" r="175" fill="none" stroke="#D88FA5" stroke-width="1.5" stroke-dasharray="5 5" />
  
  <!-- Aesthetic silhouette / Camera / Heart icon -->
  <g transform="translate(400, 360) scale(1.4)">
    <path d="M0, -45 C25,-75 80,-45 80,5 C80,45 35,75 0,105 C-35,75 -80,45 -80,5 C-80,-45 -25,-75 0,-45 Z" 
          fill="#FCE4EC" stroke="#D88FA5" stroke-width="3" />
    <path d="M0, -35 C20,-60 65,-35 65,5 C65,38 28,63 0,88 C-28,63 -65,38 -65,5 C-65,-35 -20,-60 0,-35 Z" 
          fill="#F8BBD0" opacity="0.4" />
    <!-- Sparkles -->
    <path d="M-5,-10 L0,-30 L5,-10 L25,-5 L5,0 L0,20 L-5,0 L-25,-5 Z" fill="#D88FA5" />
  </g>
  
  <!-- Gentle aesthetic sparkles -->
  <g fill="#D88FA5" opacity="0.8">
    <path d="M220, 240 Q225,255 240,260 Q225,265 220,280 Q215,265 200,260 Q215,255 220,240 Z" />
    <path d="M580, 250 Q585,262 597,266 Q585,270 580,282 Q575,270 563,266 Q575,262 580,250 Z" />
    <path d="M230, 490 Q234,500 244,503 Q234,506 230,516 Q226,506 216,503 Q226,500 230,490 Z" />
    <path d="M570, 480 Q574,490 584,493 Q574,496 570,506 Q566,496 556,493 Q566,490 570,480 Z" />
  </g>
  
  <!-- Text in center -->
  <text x="400" y="640" font-family="'Caveat', 'Dancing Script', cursive, sans-serif" font-size="44" font-weight="700" fill="#704653" text-anchor="middle">
    Your Special Photo Goes Here ♡
  </text>
  
  <text x="400" y="695" font-family="'Nunito', 'Quicksand', sans-serif" font-size="22" font-weight="600" fill="#8A6C63" text-anchor="middle">
    (Replaceable placeholder: /public/images/her-photo.jpg)
  </text>
  
  <rect x="230" y="730" width="340" height="48" rx="24" fill="#FFF0F5" stroke="#E8BDC8" stroke-width="1.5" />
  <text x="400" y="761" font-family="'Nunito', 'Quicksand', sans-serif" font-size="18" font-weight="600" fill="#704653" text-anchor="middle">
    Click or drop image to preview live ✨
  </text>
</svg>
